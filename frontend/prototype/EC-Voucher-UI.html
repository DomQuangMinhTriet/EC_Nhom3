<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EC Voucher System — UI Preview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0f1a;scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111827;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:999px}
:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.nav-panel{position:fixed;top:0;left:0;width:208px;height:100vh;background:#0c0f1a;overflow-y:auto;z-index:200;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.07)}
.nav-panel-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.nav-panel-brand-icon{width:28px;height:28px;background:#4f46e5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:-.5px;font-family:'Plus Jakarta Sans',sans-serif;box-shadow:0 0 0 1px rgba(99,102,241,.5) inset}
.nav-panel-brand-name{font-size:13px;font-weight:700;color:#f1f5f9;letter-spacing:-.2px;font-family:'Plus Jakarta Sans',sans-serif}
.nav-group-label{font-size:9.5px;font-weight:700;color:#3d4f6e;letter-spacing:.1em;text-transform:uppercase;padding:16px 16px 6px;font-family:'Plus Jakarta Sans',sans-serif}
.nav-link{display:flex;align-items:center;gap:8px;color:#64748b;font-size:12px;font-weight:500;padding:7px 10px;border-radius:6px;margin:1px 6px;cursor:pointer;transition:all .15s;text-decoration:none;line-height:1.4;font-family:'Plus Jakarta Sans',sans-serif}
.nav-link:hover{background:#141928;color:#cbd5e1}
.nav-link.active{background:rgba(79,70,229,.18);color:#a5b4fc;font-weight:600;border-left:2px solid #6366f1;border-radius:0 6px 6px 0;margin-left:6px;padding-left:8px}
.nav-link-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.5}
.main-view{margin-left:208px;height:100vh;overflow:auto;background:#0c0f1a}
.screen-viewport{transform-origin:top left;background:#f8fafc}
.screen-frame{width:1440px;min-height:900px;background:#f8fafc;overflow:hidden;position:relative}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes skelShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Phase 3 — hover & interaction polish */
button:active,a[style*="cursor:pointer"]:active{transform:scale(.97);transition:transform .1s}
.data-row-hover:hover{background:#f8fafc !important;cursor:pointer}
.card-hover:hover{box-shadow:0 8px 24px rgba(79,70,229,.12),0 2px 8px rgba(0,0,0,.06) !important;transform:translateY(-1px);transition:box-shadow .2s,transform .2s}
.notif-item{transition:filter .15s,transform .15s}.notif-item:hover{filter:brightness(.97);transform:translateX(2px);cursor:pointer}
.cat-card{transition:box-shadow .2s,transform .2s}.cat-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.1) !important;transform:translateY(-2px);cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useContext,createContext}=React;
const NavCtx=createContext(()=>{});
const ToastCtx=createContext(()=>{});

// ── DESIGN TOKENS ─────────────────────────────────────────────────────────
const T={

  primaryMuted:'rgba(79,70,229,.08)',
  accent:'#F97316', accentHover:'#EA6C0A', accentLight:'#FFF7ED', accentMuted:'rgba(249,115,22,.1)',
  // Neutrals
  gray900:'#0F172A', gray800:'#1E293B', gray700:'#334155', gray600:'#475569',
  gray500:'#64748B', gray400:'#94A3B8', gray300:'#CBD5E1', gray200:'#E2E8F0',
  gray150:'#EEF2F6', gray100:'#F1F5F9', gray50:'#F8FAFC', white:'#FFFFFF',
  // Semantic
  success:'#059669', successLight:'#ECFDF5', successMuted:'rgba(5,150,105,.1)',
  warning:'#D97706', warningLight:'#FFFBEB', warningMuted:'rgba(217,119,6,.1)',
  error:'#DC2626',   errorLight:'#FEF2F2',   errorMuted:'rgba(220,38,38,.1)',
  info:'#2563EB',    infoLight:'#EFF6FF',    infoMuted:'rgba(37,99,235,.1)',
  // Shadows — tinted with brand hue
  shadowSm:'0 1px 3px rgba(79,70,229,.05),0 1px 2px rgba(15,23,42,.06)',
  shadowMd:'0 4px 16px rgba(79,70,229,.07),0 2px 4px rgba(15,23,42,.05)',
  shadowLg:'0 12px 32px rgba(79,70,229,.1),0 4px 8px rgba(15,23,42,.06)',
  shadowXl:'0 24px 48px rgba(79,70,229,.13),0 8px 16px rgba(15,23,42,.08)',
  shadowColor:'0 8px 24px rgba(79,70,229,.25)',
  // Spacing
  sp:{2:2,4:4,6:6,8:8,10:10,12:12,14:14,16:16,20:20,24:24,28:28,32:32,40:40,48:48,56:56,64:64,80:80},
  // Radius
  r:{2:2,4:4,6:6,8:8,10:10,12:12,16:16,20:20,24:24,full:9999},
  // Typography
  text:{xs:11,sm:12,base:14,md:15,lg:16,xl:18,h4:20,h3:22,h2:24,h1:28,display:36,hero:48},
  // Font families
  font:"'Plus Jakarta Sans',system-ui,sans-serif",
  fontMono:"'JetBrains Mono',ui-monospace,monospace",
};

// ── ICON SYSTEM ───────────────────────────────────────────────────────────
const _P={
  bell:'M10 5a2 2 0 114 0 7 7 0 017 7v3l2 2H3l2-2V12A7 7 0 0110 5zm2 14a3 3 0 01-3-3h6a3 3 0 01-3 3z',
  cart:'M2 3h1.5L6 13h10l2-7H8M7 17a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm9 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3z',
  user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 1116 0H4z',
  ticket:'M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z',
  grid:'M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z',
  chart:'M9 19V13a2 2 0 00-2-2H5a2 2 0 00-2 2v6m4 0H5m4 0h2m2-9V19m0 0h-2m2 0h2m2-13v13m0 0h-2m2 0h2',
  trending:'M23 6l-9.5 9.5-5-5L1 18M17 6h6v6',
  settings:'M12 15a3 3 0 100-6 3 3 0 000 6zm7.07-1.07A7 7 0 1012 5a7 7 0 007.07 8.93z',
  plus:'M12 5v14M5 12h14',
  edit:'M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z',
  download:'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3',
  upload:'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12',
  check:'M20 6L9 17l-5-5',
  search:'M21 21l-5.2-5.2m0 0A7 7 0 115.8 5.8a7 7 0 0010 10z',
  lock:'M19 11H5a2 2 0 00-2 2v7a2 2 0 002 2h14a2 2 0 002-2v-7a2 2 0 00-2-2zM12 17v-2m-5-6V7a5 5 0 0110 0v4',
  building:'M3 21V7l9-4 9 4v14H3zm6 0V15h6v6',
  users:'M17 20H3v-2a5 5 0 015-5h6a5 5 0 015 5v2zm-7-8a4 4 0 100-8 4 4 0 000 8zm9-4a3 3 0 110 6m1-6a3 3 0 016 0m-6 6h6a4 4 0 014 4v1',
  file:'M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9l-7-7zm0 0v7h7',
  log:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4',
  qr:'M3 3h7v7H3zm0 11h7v7H3zm11-11h7v7h-7zm0 11h3v3h-3zm4 0h3v3h-3zm-4 4h3v3h-3zm4 0h3v3h-3z',
  history:'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z',
  star:'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z',
  shield:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
  bank:'M3 21h18M3 7h18M5 7V5a1 1 0 011-1h12a1 1 0 011 1v2M6 21v-7m4 7v-7m4 7v-7m4 7v-7',
  money:'M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6',
  package:'M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16zM3.27 6.96L12 12.01l8.73-5.05M12 22.08V12',
  warning:'M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4m0 4h.01',
  ban:'M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636',
  pause:'M10 9v6m4-6v6',
  repeat:'M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3',
  home:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6',
  copy:'M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-2M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3',
  camera:'M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2v11zM12 17a4 4 0 100-8 4 4 0 000 8z',
  trash:'M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6m4-6v6',
  logOut:'M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9',
  play:'M5 3l14 9-14 9V3z',
  heart:'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z',
};
const Ico=({n,size=16,color='currentColor',style:sx={}})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" style={{display:'block',flexShrink:0,...sx}}>
    <path d={_P[n]||_P.check}/>
  </svg>
);

// ── BASE COMPONENTS ────────────────────────────────────────────────────────

// Button with proper states
const Btn=({children,variant='primary',size='md',full,onClick,disabled,icon,style:sx={}})=>{
  const [hov,setHov]=useState(false);
  const [pressed,setPressed]=useState(false);
  const sizes={
    xs:{px:10,py:5,fs:T.text.xs,gap:4,r:T.r[6]},
    sm:{px:14,py:7,fs:T.text.sm,gap:5,r:T.r[8]},
    md:{px:18,py:9,fs:T.text.base,gap:6,r:T.r[10]},
    lg:{px:24,py:11,fs:T.text.md,gap:7,r:T.r[10]},
    xl:{px:32,py:14,fs:T.text.lg,gap:8,r:T.r[12]},
  }[size]||{px:18,py:9,fs:T.text.base,gap:6,r:T.r[10]};
  const variants={
    primary:{background:hov?T.primaryHover:T.primary,color:T.white,border:'none',boxShadow:hov?T.shadowColor:T.shadowSm},
    accent:{background:hov?T.accentHover:T.accent,color:T.white,border:'none',boxShadow:T.shadowSm},
    ghost:{background:hov?T.gray100:T.white,color:T.gray700,border:`1.5px solid ${T.gray200}`,boxShadow:'none'},
    outlined:{background:hov?T.primaryMuted:T.white,color:T.primary,border:`1.5px solid ${T.primary}`,boxShadow:'none'},
    danger:{background:hov?'#B91C1C':T.error,color:T.white,border:'none',boxShadow:T.shadowSm},
    success:{background:hov?'#047857':T.success,color:T.white,border:'none',boxShadow:T.shadowSm},
    subtle:{background:hov?T.gray100:T.primaryMuted,color:T.primary,border:'none',boxShadow:'none'},
    link:{background:'transparent',color:hov?T.primaryHover:T.primary,border:'none',boxShadow:'none'},
  }[variant]||{};
  return(
    <button
      disabled={disabled}
      onClick={onClick}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>{setHov(false);setPressed(false);}}
      onMouseDown={()=>setPressed(true)}
      onMouseUp={()=>setPressed(false)}
      style={{
        display:'inline-flex',alignItems:'center',justifyContent:'center',
        gap:sizes.gap,
        paddingLeft:sizes.px,paddingRight:sizes.px,paddingTop:sizes.py,paddingBottom:sizes.py,
        fontSize:sizes.fs,fontWeight:600,borderRadius:sizes.r,
        cursor:disabled?'not-allowed':'pointer',
        width:full?'100%':undefined,
        fontFamily:T.font,letterSpacing:'-.02em',
        transition:'all .18s cubic-bezier(.4,0,.2,1)',
        transform:pressed?'scale(0.97)':'scale(1)',
        opacity:disabled?.5:1,
        ...variants,
        ...sx
      }}>
      {icon&&<span style={{fontSize:sizes.fs*1.1,lineHeight:1,display:'inline-flex',alignItems:'center'}}>{icon}</span>}
      {children}
    </button>
  );
};

// Refined Badge
const Badge=({children,variant='default',size='sm'})=>{
  const p=size==='sm'?{px:8,py:3,fs:T.text.xs}:{px:10,py:4,fs:T.text.sm};
  const v={
    default:{background:T.gray100,color:T.gray600,dot:T.gray400},
    success:{background:T.successLight,color:T.success,dot:T.success},
    warning:{background:T.warningLight,color:T.warning,dot:T.warning},
    error:{background:T.errorLight,color:T.error,dot:T.error},
    primary:{background:T.primaryLight,color:T.primary,dot:T.primary},
    accent:{background:T.accentLight,color:T.accent,dot:T.accent},
    info:{background:T.infoLight,color:T.info,dot:T.info},
    dark:{background:T.gray800,color:T.gray300,dot:T.gray400},
  }[variant]||{background:T.gray100,color:T.gray600};
  return(
    <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:`${p.py}px ${p.px}px`,borderRadius:T.r.full,fontSize:p.fs,fontWeight:600,letterSpacing:'.01em',...v}}>
      <span style={{width:5,height:5,borderRadius:'50%',background:v.dot,flexShrink:0}}/>
      {children}
    </span>
  );
};

// Input with proper states
const Input=({label,placeholder,type='text',helper,error,defaultValue,required=true,hint,width,prefix})=>(
  <div style={{display:'flex',flexDirection:'column',gap:5,width:width||'100%'}}>
    {label&&(
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <label style={{fontSize:T.text.sm,fontWeight:600,color:T.gray700,letterSpacing:'-.01em'}}>
          {label}{required&&<span style={{color:T.error,marginLeft:3}}>*</span>}
        </label>
        {hint&&<span style={{fontSize:T.text.xs,color:T.gray400}}>{hint}</span>}
      </div>
    )}
    <div style={{position:'relative',display:'flex',alignItems:'center'}}>
      {prefix&&<span style={{position:'absolute',left:12,color:T.gray400,fontSize:T.text.base,pointerEvents:'none'}}>{prefix}</span>}
      <input
        type={type}
        placeholder={placeholder}
        defaultValue={defaultValue}
        style={{
          width:'100%',
          padding:`10px ${prefix?'14px 10px 36px':'14px'}`,
          fontSize:T.text.base,
          border:`1.5px solid ${error?T.error:T.gray200}`,
          borderRadius:T.r[8],
          outline:'none',fontFamily:T.font,
          background:error?T.errorLight:T.white,
          color:T.gray900,letterSpacing:'-.01em',
          boxShadow:T.shadowSm,
          transition:'border .15s,box-shadow .15s',
        }}
        onFocus={e=>{e.target.style.borderColor=error?T.error:T.primary;e.target.style.boxShadow=`0 0 0 3px ${error?'rgba(220,38,38,.12)':'rgba(79,70,229,.12)'}`}}
        onBlur={e=>{e.target.style.borderColor=error?T.error:T.gray200;e.target.style.boxShadow=T.shadowSm}}
      />
    </div>
    {(helper||error)&&<span style={{fontSize:T.text.xs,color:error?T.error:T.gray400,display:'flex',gap:4,alignItems:'center'}}>{error&&<Ico n="warning" size={11} color={T.error} style={{flexShrink:0}}/>}{helper||error}</span>}
  </div>
);

const Textarea=({label,placeholder,rows=3,required=true,defaultValue})=>(
  <div style={{display:'flex',flexDirection:'column',gap:5}}>
    {label&&<label style={{fontSize:T.text.sm,fontWeight:600,color:T.gray700}}>{label}{required&&<span style={{color:T.error,marginLeft:3}}>*</span>}</label>}
    <textarea placeholder={placeholder} rows={rows} defaultValue={defaultValue} style={{width:'100%',padding:'10px 14px',fontSize:T.text.base,border:`1.5px solid ${T.gray200}`,borderRadius:T.r[8],fontFamily:T.font,color:T.gray900,resize:'vertical',boxShadow:T.shadowSm,outline:'none',lineHeight:1.6}}
      onFocus={e=>{e.target.style.borderColor=T.primary;e.target.style.boxShadow=`0 0 0 3px rgba(79,70,229,.12)`}}
      onBlur={e=>{e.target.style.borderColor=T.gray200;e.target.style.boxShadow=T.shadowSm}}/>
  </div>
);

const Select=({label,options=[],width,required=false})=>(
  <div style={{display:'flex',flexDirection:'column',gap:5,width:width||'100%'}}>
    {label&&<label style={{fontSize:T.text.sm,fontWeight:600,color:T.gray700}}>{label}{required&&<span style={{color:T.error,marginLeft:3}}>*</span>}</label>}
    <select style={{width:'100%',padding:'10px 14px',fontSize:T.text.base,border:`1.5px solid ${T.gray200}`,borderRadius:T.r[8],background:T.white,fontFamily:T.font,color:T.gray700,cursor:'pointer',boxShadow:T.shadowSm,outline:'none'}}>
      {options.map(o=><option key={o}>{o}</option>)}
    </select>
  </div>
);

// Card with elevation variants
const Card=({children,p=24,elevation='md',style:sx={},onClick})=>{
  const [hov,setHov]=useState(false);
  const shadows={flat:'none',sm:T.shadowSm,md:T.shadowMd,lg:T.shadowLg};
  return(
    <div
      onClick={onClick}
      onMouseEnter={()=>onClick&&setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        background:T.white,borderRadius:T.r[12],
        border:`1px solid ${T.gray200}`,
        padding:p,
        boxShadow:hov&&onClick?T.shadowLg:shadows[elevation]||T.shadowMd,
        cursor:onClick?'pointer':'default',
        transition:'all .2s',
        ...sx
      }}>
      {children}
    </div>
  );
};

const Divider=({my=16,label})=>label?(
  <div style={{display:'flex',alignItems:'center',gap:12,margin:`${my}px 0`}}>
    <div style={{flex:1,height:1,background:T.gray200}}/>
    <span style={{fontSize:T.text.xs,color:T.gray400,fontWeight:500,whiteSpace:'nowrap'}}>{label}</span>
    <div style={{flex:1,height:1,background:T.gray200}}/>
  </div>
):<div style={{height:1,background:T.gray200,margin:`${my}px 0`}}/>;

// Avatar
const Avatar=({size=36,color=T.primary,initials='EC',img,status})=>(
  <div style={{position:'relative',flexShrink:0}}>
    <div style={{width:size,height:size,borderRadius:T.r.full,background:img?undefined:`linear-gradient(135deg,${color},${color}dd)`,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',boxShadow:`0 0 0 2px ${T.white},0 0 0 3px ${color}33`}}>
      {img?<img src={img} style={{width:'100%',height:'100%',objectFit:'cover'}} alt=""/>:<span style={{color:T.white,fontSize:size*.32,fontWeight:700,letterSpacing:'-.5px'}}>{initials}</span>}
    </div>
    {status&&<div style={{position:'absolute',bottom:0,right:0,width:size*.28,height:size*.28,borderRadius:'50%',background:status==='online'?T.success:T.gray300,border:`2px solid ${T.white}`}}/>}
  </div>

];

const GROUPS=[...new Set(SCREENS.map(s=>s.g))];
const SCALE=0.70;

const mainViewRef=React.createRef();

function App(){
  const [active,setActive]=useState('s01');
  const [toasts,setToasts]=useState([]);

  const cur=SCREENS.find(s=>s.id===active)||SCREENS[0];
  const Comp=cur.comp;

  const navigate=(id)=>{
    setActive(id);
    if(mainViewRef.current) mainViewRef.current.scrollTop=0;
  };

  const showToast=useCallback((msg,type='success',title='')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,message:msg,type,title}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);
  },[]);

  const dismissToast=(id)=>setToasts(p=>p.filter(t=>t.id!==id));

  useEffect(()=>{
    const onKey=e=>{
      if(e.key==='ArrowRight'||e.key==='ArrowDown'){
        const i=SCREENS.findIndex(s=>s.id===active);
        if(i<SCREENS.length-1)navigate(SCREENS[i+1].id);
      }
      if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
        const i=SCREENS.findIndex(s=>s.id===active);
        if(i>0)navigate(SCREENS[i-1].id);
      }
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[active]);

  return(
    <NavCtx.Provider value={navigate}>
    <ToastCtx.Provider value={showToast}>
      {/* Navigation panel */}
      <nav className="nav-panel">
        <div className="nav-panel-brand">
          <div className="nav-panel-brand-icon">EC</div>
          <div>
            <div className="nav-panel-brand-name">ECVoucher UI</div>
            <div style={{color:'#475569',fontSize:9,letterSpacing:'.04em',marginTop:1}}>31 SCREENS · HK3 2526</div>
          </div>
        </div>
        <div style={{padding:'8px 6px 4px',borderBottom:'1px solid #1e293b',marginBottom:4}}>
          <div style={{background:'#1e293b',borderRadius:6,padding:'5px 8px',display:'flex',alignItems:'center',gap:6}}>
            <Ico n="search" size={12} color="#475569"/>
            <span style={{color:'#475569',fontSize:11}}>← → phím điều hướng</span>
          </div>
        </div>
        {GROUPS.map(g=>(
          <div key={g}>
            <div className="nav-group-label">{g}</div>
            {SCREENS.filter(s=>s.g===g).map(s=>(
              <a key={s.id} className={'nav-link'+(s.id===active?' active':'')} onClick={()=>navigate(s.id)}>
                <span className="nav-link-dot"/>
                <span>{s.label}</span>
              </a>
            ))}
          </div>
        ))}
        <div style={{padding:'12px 14px',borderTop:'1px solid #1e293b',marginTop:'auto'}}>
          <div style={{color:'#1e293b',fontSize:10,background:'#1e293b',borderRadius:4,padding:'6px 10px',textAlign:'center'}}>
            <div style={{color:'#475569',fontSize:10,fontWeight:600}}>EC Voucher System</div>
            <div style={{color:'#334155',fontSize:9,marginTop:2}}>HCMUS · HK3 2025–2026</div>
          </div>
        </div>
      </nav>
      {/* Main content */}
      <div className="main-view" ref={mainViewRef}>
        <div style={{transform:`scale(${SCALE})`,transformOrigin:'top left',width:`${100/SCALE}%`,minHeight:`${100/SCALE}vh`}}>
          <div className="screen-frame">
            <Comp/>
          </div>
        </div>
        <ToastContainer toasts={toasts} onDismiss={dismissToast}/>
      </div>
    </ToastCtx.Provider>
    </NavCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
